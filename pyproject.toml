[project]
name = "sos-cwl-runner"
version = "0.3.0"
description = "cwltool with SOS extensions: file format validation (SOS File Format Service) and resource demand annotations"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.16"
dependencies = [
    "cwltool==3.3.20260925135507",
    "cwl-utils==0.45",
    "httpx>=0.27",
    "rdflib>=7.1",
    "pyshacl>=0.30",
    "packaging>=24",
]

[project.scripts]
sos-cwl-runner = "sos_cwl.core.runner:main"
sos-cwl-lint = "sos_cwl.core.lint:main"

# Extensions: the core finds them here and never imports them itself.
[project.entry-points."sos_cwl.extensions"]
format-validation = "sos_cwl.extensions.format_validation:FormatValidationExtension"
resource-demand = "sos_cwl.extensions.resource_demand:ResourceDemandExtension"

[dependency-groups]
dev = [
    "pytest>=8",
    "respx>=0.21",
    "ruff>=0.14",
    # data generator (tests/format_validation/fixtures/make_data.py); fiona has no Python 3.14 wheels yet
    "numpy",
    "rasterio",
    "fiona; python_version < '3.14'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sos_cwl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a running SOS File Format Service (SOS_FFS_URL)"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
