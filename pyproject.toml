[project]
name = "format-aware-cwl-runner"
version = "0.1.0"
description = "cwltool extension that validates files against their declared format via the SOS File Format Service"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.16"
dependencies = [
    "cwltool==3.3.20260925135507",
    "cwl-utils==0.45",
    "httpx>=0.27",
]

[project.scripts]
cwl-format-aware-runner = "format_aware_cwl.runner:main"
cwl-format-lint = "format_aware_cwl.lint:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "respx>=0.21",
    "ruff>=0.14",
    # data generators (bench/make_inputs.py, tests/fixtures/make_data.py); fiona has no Python 3.14 wheels yet
    "numpy",
    "rasterio",
    "fiona; python_version < '3.14'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/format_aware_cwl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a running SOS File Format Service (SOS_FFS_URL)"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
